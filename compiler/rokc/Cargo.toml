[package]
name = "rokc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rokc"
path = "src/main.rs"
# No unit tests; a test harness link would write the same /IMPLIB
# (build.rs) as the binary at once, a Windows LNK1104 on rokc.exp.
test = false

[dependencies]
rokc_core = { workspace = true }
rokc_fmt = { workspace = true }
rokc_interface = { workspace = true }
# Its build script lists the symbols rokc exports (build.rs).
rokc_llvm = { workspace = true }
rokc_tools = { workspace = true }

[dev-dependencies]
rokc_diagnostic = { workspace = true }
rokc_harness = { workspace = true }
rokc_lexer = { workspace = true }
rokc_parser = { workspace = true }
rokc_rokon = { workspace = true }
rokc_target = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# tests/fuzz.rs: the CPU limit of a checked `rokc`.
libc = { workspace = true }

[lints]
workspace = true

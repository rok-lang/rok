[package]
name = "rok"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# `rok`: the package manager / toolchain front (rok.rokon, rok.lock,
# environments, toolchains); it runs `rokc` for the compiler commands.
[[bin]]
name = "rok"
path = "src/main.rs"

# The language server alone (`rok lsp`), for editors that launch it by name.
[[bin]]
name = "rokls"
path = "src/bin/rokls.rs"

[dependencies]
rokc_core = { workspace = true }
rokc_diagnostic = { workspace = true }
rokc_harness = { workspace = true }
rokc_lexer = { workspace = true }
rokc_rokon = { workspace = true }
rokc_target = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# tests/rok.rs: install.sh on a pseudo-terminal.
libc = { workspace = true }

[lints]
workspace = true

# 32-bit glibc (i686, armv7): the `libc` crate binds the 64-bit time
# interfaces (`__clock_gettime64`, `__fstat64_time64`, ..., glibc 2.34+)
# and, with them, the large-file ones (`lseek64`, `readdir64`, ...):
# no 2038 limit, no EOVERFLOW past 2 GiB. No effect on other targets.
[env]
RUST_LIBC_UNSTABLE_GNU_TIME_BITS = "64"

# aarch64 musl: LLVM's Memory.cpp calls __clear_cache (an instruction-
# cache flush on arm64), which musl leaves to libgcc. A static musl rokc
# links with -nodefaultlibs, so pull libgcc in to resolve it. x86_64
# needs no such flush, and other targets link no LLVM.
[target.aarch64-unknown-linux-musl]
rustflags = ["-Clink-arg=-lgcc"]

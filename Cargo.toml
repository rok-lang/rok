[workspace]
resolver = "3"
members = [
    "compiler/rok",
    "compiler/rokc",
    "compiler/rokc_ast",
    "compiler/rokc_codegen_mlir",
    "compiler/rokc_codegen_native",
    "compiler/rokc_core",
    "compiler/rokc_diagnostic",
    "compiler/rokc_driver",
    "compiler/rokc_fmt",
    "compiler/rokc_harness",
    "compiler/rokc_hir",
    "compiler/rokc_interface",
    "compiler/rokc_ir_common",
    "compiler/rokc_lexer",
    "compiler/rokc_llvm",
    "compiler/rokc_mir",
    "compiler/rokc_parser",
    "compiler/rokc_rokon",
    "compiler/rokc_target",
    "compiler/rokc_tools",
    "compiler/rokc_wit",
    "runtime/rokr",
    "runtime/rokr_common",
    "runtime/rokr_gc",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Han Damin <miniex@daminstudio.net>"]

[workspace.dependencies]
rokc_ast = { path = "compiler/rokc_ast" }
rokc_codegen_mlir = { path = "compiler/rokc_codegen_mlir" }
rokc_codegen_native = { path = "compiler/rokc_codegen_native" }
rokc_core = { path = "compiler/rokc_core" }
rokc_diagnostic = { path = "compiler/rokc_diagnostic" }
rokc_driver = { path = "compiler/rokc_driver" }
rokc_fmt = { path = "compiler/rokc_fmt" }
rokc_harness = { path = "compiler/rokc_harness" }
rokc_hir = { path = "compiler/rokc_hir" }
rokc_interface = { path = "compiler/rokc_interface" }
rokc_ir_common = { path = "compiler/rokc_ir_common" }
rokc_lexer = { path = "compiler/rokc_lexer" }
rokc_llvm = { path = "compiler/rokc_llvm" }
rokc_mir = { path = "compiler/rokc_mir" }
rokc_parser = { path = "compiler/rokc_parser" }
rokc_rokon = { path = "compiler/rokc_rokon" }
rokc_target = { path = "compiler/rokc_target" }
rokc_tools = { path = "compiler/rokc_tools" }
rokc_wit = { path = "compiler/rokc_wit" }

rokr_common = { path = "runtime/rokr_common" }
rokr_gc = { path = "runtime/rokr_gc" }

# Platform sys crates only; zero external dependencies.
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unused_must_use = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
struct_field_names = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
uninlined_format_args = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false
strip = "debuginfo"
# rokr is no_std + staticlib; abort panics avoid eh_personality.
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

# Recursive descent at the nesting cap: ~150 KB of frames per level
# unoptimized, ~20 KB at opt-level 1 (`PARSER_STACK`).
[profile.dev.package.rokc_parser]
opt-level = 1

# The runtime is linked into every program a dev rokc builds: unoptimized,
# its collector is ~6x slower and GC-heavy programs (tests included) crawl.
[profile.dev.package.rokr]
opt-level = 2
[profile.dev.package.rokr_gc]
opt-level = 2
[profile.dev.package.rokr_common]
opt-level = 2

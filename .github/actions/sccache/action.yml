name: sccache
description: >
  rustc through sccache, cached in the public rok-lang-artifacts S3 bucket
  under sccache/<os>-<arch>/ (expired after 14 days by a lifecycle rule).
  Writes need the rok-ci-sccache role's credentials in the environment
  (configure-aws-credentials before this step, push / merge queue /
  nightly only); without them the cache is read-only.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        V: "0.18.0"
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) t=x86_64-unknown-linux-musl sum=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
          Linux-ARM64) t=aarch64-unknown-linux-musl sum=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
          macOS-ARM64) t=aarch64-apple-darwin sum=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;
          # windows-arm64 runs the x64 toolchain under emulation.
          Windows-X64 | Windows-ARM64) t=x86_64-pc-windows-msvc sum=1a63c1be2beab3f04d27e4cc145443e092e02d3dd83a51030989829d7023091b ;;
          *)
            echo "::error::no sccache build for $RUNNER_OS-$RUNNER_ARCH"
            exit 1
            ;;
        esac
        tmp=$RUNNER_TEMP
        [ "$RUNNER_OS" = Windows ] && tmp=$(cygpath -u "$RUNNER_TEMP")
        a=sccache-v$V-$t
        curl -fsSL -o "$tmp/$a.tar.gz" "https://github.com/mozilla/sccache/releases/download/v$V/$a.tar.gz"
        if command -v sha256sum > /dev/null 2>&1; then got=$(sha256sum "$tmp/$a.tar.gz"); else got=$(shasum -a 256 "$tmp/$a.tar.gz"); fi
        [ "${got%% *}" = "$sum" ] || {
          echo "::error::sha256 mismatch for $a"
          exit 1
        }
        tar -xzf "$tmp/$a.tar.gz" -C "$tmp"
        exe=$tmp/$a/sccache
        [ "$RUNNER_OS" = Windows ] && exe=$(cygpath -w "$exe.exe")
        os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        {
          echo "RUSTC_WRAPPER=$exe"
          echo "SCCACHE=$exe"
          # sccache cannot cache incremental builds.
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_BUCKET=rok-lang-artifacts"
          echo "SCCACHE_REGION=us-east-1"
          echo "SCCACHE_S3_KEY_PREFIX=sccache/$os-$arch"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || echo "SCCACHE_S3_NO_CREDENTIALS=true"
        } >> "$GITHUB_ENV"
        if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then echo "sccache: read-write"; else echo "sccache: read-only"; fi
        # Start the server here, so a bucket error costs the cache, not the
        # build (one 403 SignatureDoesNotMatch in 32 jobs failed a corpus).
        export SCCACHE_BUCKET=rok-lang-artifacts SCCACHE_REGION=us-east-1 SCCACHE_S3_KEY_PREFIX=sccache/$os-$arch SCCACHE_IDLE_TIMEOUT=0
        [ -n "${AWS_ACCESS_KEY_ID:-}" ] || export SCCACHE_S3_NO_CREDENTIALS=true
        for i in 1 2 3; do
          "$tmp/$a/sccache" --start-server > /dev/null 2>&1 && exit 0
          "$tmp/$a/sccache" --stop-server > /dev/null 2>&1 || true
          sleep $((i * 5))
        done
        echo "::warning::sccache did not start; building without it"
        echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

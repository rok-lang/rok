version: 2

# Minor and patch bumps are grouped into one PR per ecosystem (low-risk, low
# churn); a major bump comes as its own PR so a breaking update is reviewed on
# its own. github-actions keeps the SHA-pinned actions current (the controlled
# counterpart to pinning); cargo tracks the Rust workspace.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    labels:
      - "area: ci"
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types:
          - minor
          - patch

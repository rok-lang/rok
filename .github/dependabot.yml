version: 2

# Controlled updates for the SHA-pinned GitHub Actions (the counterpart to
# pinning: dependabot bumps the pins in reviewed PRs) and the Rust workspace.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types:
          - minor
          - patch

name: prefixes

# Build the pinned LLVM (and libclang) prefix for each native host and
# upload it, SHA-256 verified, to the public rok-lang-artifacts S3 bucket at
# llvm/<version>/<host>/{llvm,libclang}.tar.gz, which the
# .github/actions/{llvm,libclang}-prefix actions download. Run once per
# version, or when the build scripts change. Upload auth is keyless (OIDC ->
# rok-ci-artifacts). Windows's LLVM is published from the box by
# prefixes-windows.yml (it exceeds the 6 h job limit here).
on:
  workflow_dispatch:
    inputs:
      what:
        description: "llvm, libclang or both."
        default: both
  # A pull request that changes a prefix build input does not rebuild here
  # (that needs OIDC write and hours); only the notice job runs, to flag that
  # the published S3 prefixes are now stale and must be refreshed by hand.
  pull_request:
    paths:
      - llvm/build.sh
      - llvm/build.ps1
      - llvm/build-libclang.sh
      - llvm/build-libclang.ps1
      - llvm/rok.profdata.xz
      - llvm/rok-msvc.profdata.tar.xz
      - llvm/patches/**
      - dist-linux-gnu.Containerfile
      - dist-linux-musl.Containerfile
      - .github/workflows/prefixes.yml

# Rebuild a subset by re-running only the failed jobs of a run
# (gh run rerun --failed), or re-dispatch with what=llvm / what=libclang.

permissions:
  id-token: write   # OIDC -> assume rok-ci-artifacts for the S3 upload
  contents: read

env:
  AWS_ROLE: arn:aws:iam::893677554379:role/rok-ci-artifacts
  AWS_REGION: us-east-1
  BUCKET: rok-lang-artifacts

jobs:
  # On a pull request (a prefix build input changed) this is the only job that
  # runs: it does not rebuild, it fails loudly so the stale S3 prefixes are not
  # forgotten. Refresh them with a manual run (Run workflow, what=both) before
  # the next release. Not a required check, so it does not block the merge.
  notice:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Prefixes are stale
        run: |
          {
            echo "## Prefix build inputs changed"
            echo
            echo "The pinned LLVM / libclang prefix inputs changed, so the prefixes"
            echo "published to \`s3://$BUCKET/llvm/<version>/\` and"
            echo "\`dist-llvm/<version>/\` are now stale."
            echo
            echo "Re-run this workflow by hand (Actions > prefixes > Run workflow,"
            echo "what=both) to rebuild and republish them before the next release."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::prefix build inputs changed; re-run prefixes.yml (what=both) to refresh the S3 prefixes before releasing"

  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-arm64,  runs-on: macos-latest,     triple: aarch64-apple-darwin }
          - { host: linux-x64,    runs-on: ubuntu-latest,     triple: x86_64-unknown-linux-gnu }
          - { host: linux-arm64,  runs-on: ubuntu-24.04-arm,  triple: aarch64-unknown-linux-gnu }
    name: build (${{ matrix.host }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    env:
      HOST: ${{ matrix.host }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # The build tree needs ~15 GB more than a runner's free disk.
      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h "$HOME"

      # clang reads llvm/rok.profdata.xz (indexed format 12: clang 19+);
      # Ubuntu 24.04's default clang is 18 and its c++ is gcc.
      - name: Build, strip and publish LLVM
        if: inputs.what == 'both' || inputs.what == 'llvm'
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION=//p' llvm/build.sh)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q clang-19
            export CC=clang-19 CXX=clang++-19
          fi
          pfx=$RUNNER_TEMP/llvm-$v
          llvm/build.sh "$pfx" 2>&1 | tee "$RUNNER_TEMP/llvm-build.log"
          if grep -q 'without PGO' "$RUNNER_TEMP/llvm-build.log"; then
            echo "::error::the LLVM prefix was built without llvm/rok.profdata.xz"; exit 1
          fi
          # Drop what rokc_llvm's build.rs never links; mark it complete.
          ( cd "$pfx" && rm -rf lib/objects-Release share/opt-viewer lib/*.dylib lib/*.so lib/*.so.* && du -sh . && touch .complete )
          mkdir -p out
          a=rok-llvm-$v-$HOST.tar.gz
          tar -C "$RUNNER_TEMP" -czf "out/$a" "llvm-$v"
          ( cd out && { command -v sha256sum >/dev/null 2>&1 && sha256sum "$a" || shasum -a 256 "$a"; } > "$a.sha256" )
          aws s3 cp "out/$a"        "s3://$BUCKET/llvm/$v/$TRIPLE/llvm.tar.gz"
          aws s3 cp "out/$a.sha256" "s3://$BUCKET/llvm/$v/$TRIPLE/llvm.tar.gz.sha256"

      - name: Build and publish libclang
        if: inputs.what == 'both' || inputs.what == 'libclang'
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION=//p' llvm/build-libclang.sh)
          pfx=$RUNNER_TEMP/libclang-$v
          llvm/build-libclang.sh "$pfx"
          touch "$pfx/.complete"
          mkdir -p out
          a=rok-libclang-$v-$HOST.tar.gz
          tar -C "$RUNNER_TEMP" -czf "out/$a" "libclang-$v"
          ( cd out && { command -v sha256sum >/dev/null 2>&1 && sha256sum "$a" || shasum -a 256 "$a"; } > "$a.sha256" )
          aws s3 cp "out/$a"        "s3://$BUCKET/llvm/$v/$TRIPLE/libclang.tar.gz"
          aws s3 cp "out/$a.sha256" "s3://$BUCKET/llvm/$v/$TRIPLE/libclang.tar.gz.sha256"

  # libclang on Windows builds within the limit (unlike the LLVM prefix), so
  # it is produced here, not on the box. It downloads the Windows LLVM prefix
  # (publish it first with prefixes-windows.yml).
  libclang-windows:
    name: build (windows-x64 libclang)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.what == 'both' || inputs.what == 'libclang') }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/llvm-prefix
      - id: lc
        shell: bash
        run: echo "v=$(sed -n 's/^VERSION=//p' llvm/build-libclang.sh)" >> "$GITHUB_OUTPUT"
      - name: Build libclang
        shell: pwsh
        run: '& llvm/build-libclang.ps1 "$env:RUNNER_TEMP\libclang-${{ steps.lc.outputs.v }}"'
      - name: Publish libclang
        shell: bash
        env:
          V: ${{ steps.lc.outputs.v }}
          TRIPLE: x86_64-pc-windows-msvc
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          touch "$tmp/libclang-$V/.complete"
          mkdir -p "$tmp/out"
          a=rok-libclang-$V-windows-x64.tar.gz
          tar -C "$tmp" -czf "$tmp/out/$a" "libclang-$V"
          ( cd "$tmp/out" && { command -v sha256sum >/dev/null 2>&1 && sha256sum "$a" || shasum -a 256 "$a"; } > "$a.sha256" )
          aws s3 cp "$tmp/out/$a"        "s3://$BUCKET/llvm/$V/$TRIPLE/libclang.tar.gz"
          aws s3 cp "$tmp/out/$a.sha256" "s3://$BUCKET/llvm/$V/$TRIPLE/libclang.tar.gz.sha256"

  # The Linux container LLVM (and, for gnu, libclang): built inside the
  # Debian 11 / Alpine release image by dist-llvm-prefix.sh and published to
  # dist-llvm/<version>/<triple>/, which dist-linux-{gnu,musl}.sh download
  # instead of building in-container. The image's glibc/libc is older than a
  # CI host's, so these cannot be the host prefixes above. Run once per
  # version (and whenever the build scripts or Containerfiles change).
  dist-llvm:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.what == 'both' || inputs.what == 'llvm') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: gnu, arch: x64, runs-on: ubuntu-latest, triple: x86_64-unknown-linux-gnu }
          - { kind: gnu, arch: arm64, runs-on: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { kind: musl, arch: x64, runs-on: ubuntu-latest, triple: x86_64-unknown-linux-musl }
          - { kind: musl, arch: arm64, runs-on: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl }
    name: build (${{ matrix.triple }} container)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    env:
      KIND: ${{ matrix.kind }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h "$HOME"
      - name: Build and publish the container prefix
        run: |
          v=$(sed -n 's/^VERSION=//p' llvm/build.sh)
          scripts/dist-llvm-prefix.sh "$KIND" --out "$RUNNER_TEMP/dist-llvm"
          pkg=$RUNNER_TEMP/dist-llvm/pkg
          for f in llvm.tar.gz llvm.tar.gz.sha256; do
            aws s3 cp "$pkg/$f" "s3://$BUCKET/dist-llvm/$v/$TRIPLE/$f"
          done
          if [ "$KIND" = gnu ]; then
            for f in libclang.tar.gz libclang.tar.gz.sha256; do
              aws s3 cp "$pkg/$f" "s3://$BUCKET/dist-llvm/$v/$TRIPLE/$f"
            done
          fi

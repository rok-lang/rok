name: ci

# Three tiers (docs/ci.md):
#   fast     pull request: linux-x64 and windows-x64, -O0
#   main     merge queue, push to main: every gate host at -O0; a push
#            the merge queue already passed runs lint only
#   nightly  schedule, manual run: every host at -O0 and -O2, cross
#            targets, wasm, bindgen, dist; a manual run's inputs pick a
#            subset
on:
  # Push runs on main only; a branch is covered by its PR, not twice. No
  # paths filter: ci-gate is required, so a docs-only PR must still report
  # it (plan runs lint only there).
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:
    inputs:
      hosts:
        description: "Hosts: all, or some of linux-x64 linux-arm64 macos-arm64 windows-x64 windows-arm64"
        default: all
      jobs:
        description: "Jobs after the prefixes: all, or some of gate cross wasm bindgen dist (none: prefixes only)"
        default: all
      filter:
        description: "ROK_TEST_FILTER: the integration cases to run (empty: all)"
        default: ""

# A newer run of the same branch and event cancels the older one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Writes to the sccache bucket (.github/actions/sccache); assumed only
  # outside pull requests.
  SCCACHE_ROLE: arn:aws:iam::893677554379:role/rok-ci-sccache

defaults:
  run:
    shell: bash

jobs:
  # Shell/PowerShell hygiene via the justfile recipes, so CI and local `just`
  # match. Cheap, runs on every event.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: shfmt
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          echo "fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66  /usr/local/bin/shfmt" | sha256sum -c -
          sudo chmod +x /usr/local/bin/shfmt
          just fmt-check-sh
      - name: shellcheck
        run: just lint-sh
      - name: actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # SC2015 (A && B || C): the sha-tool fallbacks are intentional.
          "$RUNNER_TEMP/actionlint" -shellcheck="shellcheck -e SC2015"
      - name: version consistency
        run: just version-check
      - name: target consistency
        run: just check-targets
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # The PSGallery download fails intermittently; retry before giving up.
          for ($i = 1; $i -le 3; $i++) {
            try {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck
              break
            } catch {
              if ($i -eq 3) { throw }
              Start-Sleep ($i * 10)
            }
          }
          just lint-ps

  # Decide what runs. Outputs: hosts (gate hosts), prefixes (hosts whose LLVM
  # prefix a later job restores), runners (host -> runs-on; a repo variable can
  # pick a self-hosted runner, never for a fork PR), cross (target + host).
  plan:
    # Gate the whole build on lint: a formatting or lint failure skips plan and
    # everything downstream, so no build runs for code that would not merge.
    needs: [lint]
    # The nightly schedule runs only where the repository variable ROK_NIGHTLY is `on`.
    if: github.event_name != 'schedule' || vars.ROK_NIGHTLY == 'on'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The merge queue's runs of this commit (a push it already tested).
      actions: read
    outputs:
      hosts: ${{ steps.plan.outputs.hosts }}
      prefixes: ${{ steps.plan.outputs.prefixes }}
      bindgen: ${{ steps.plan.outputs.bindgen }}
      dist: ${{ steps.plan.outputs.dist }}
      runners: ${{ steps.plan.outputs.runners }}
      opts: ${{ steps.plan.outputs.opts }}
      cross: ${{ steps.plan.outputs.cross }}
      jobs: ${{ steps.plan.outputs.jobs }}
      filter: ${{ steps.plan.outputs.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_HOSTS: ${{ inputs.hosts }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_FILTER: ${{ inputs.filter }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LINUX_RUNNER: ${{ vars.ROK_LINUX_RUNNER }}
          WINDOWS_RUNNER: ${{ vars.ROK_WINDOWS_RUNNER }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          all='[
            {"name": "linux-x64", "os": "ubuntu-24.04", "gate": true},
            {"name": "linux-arm64", "os": "ubuntu-24.04-arm", "gate": true},
            {"name": "macos-arm64", "os": "macos-26", "gate": true},
            {"name": "windows-x64", "os": "windows-2022", "gate": true},
            {"name": "windows-arm64", "os": "windows-11-arm", "gate": false}
          ]'
          # windows-arm64 runs an x64 rokc (emulated) with the x64 prefix.
          cross='[
            {"target": "i686-unknown-linux-gnu", "host": "linux-x64"},
            {"target": "armv7-unknown-linux-gnueabihf", "host": "linux-x64"},
            {"target": "x86_64-unknown-linux-musl", "host": "linux-x64"},
            {"target": "aarch64-unknown-linux-musl", "host": "linux-arm64"},
            {"target": "i686-pc-windows-msvc", "host": "windows-x64"},
            {"target": "aarch64-pc-windows-msvc", "host": "windows-arm64"}
          ]'
          case $EVENT:$REF in
          schedule:* | workflow_dispatch:*) tier=nightly ;;
          merge_group:* | push:refs/heads/main) tier=main ;;
          *) tier=fast ;;
          esac
          filter=
          case $tier in
          fast) hosts="linux-x64 windows-x64" jobs=gate opts='["-O0"]' ;;
          main) hosts="linux-x64 linux-arm64 macos-arm64 windows-x64" jobs=gate opts='["-O0"]' ;;
          nightly)
            hosts=${IN_HOSTS:-all} jobs=${IN_JOBS:-all} opts='["-O0", "-O2"]' filter=$IN_FILTER
            [ "$hosts" = all ] && hosts=$(echo "$all" | jq -r '.[].name')
            [ "$jobs" = all ] && jobs="gate cross wasm bindgen dist"
            ;;
          esac
          # Skip the gate (blank hosts/jobs, lint only) for changes that cannot
          # affect the build (docs, *.md, CI config) and for draft PRs. Never
          # skip nightly, the merge queue, or a new branch's first push, and run
          # when the diff is unavailable.
          if [ "$tier" != nightly ] && [ "$EVENT" != merge_group ]; then
            changed=""
            if [ "$EVENT" = pull_request ]; then
              changed=$(git diff --name-only "$PR_BASE...$PR_HEAD" 2> /dev/null) || changed=""
            elif [ "$EVENT" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
              changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" 2> /dev/null) || changed=""
            fi
            skip=""
            if [ "$DRAFT" = true ]; then
              skip="draft PR"
            elif [ "$EVENT" = push ] &&
              [ -n "$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$PUSH_AFTER&event=merge_group&status=success" --jq '.workflow_runs[0].id // empty')" ]; then
              skip="the merge queue passed this commit"
            elif [ -n "$changed" ]; then
              relevant=$(printf '%s\n' "$changed" | while IFS= read -r f; do
                [ -n "$f" ] || continue
                case $f in
                docs/* | *.md | LICENSE* | assets/* | .gitignore | .github/ISSUE_TEMPLATE/* | .github/dependabot.yml | .github/CODEOWNERS | .github/workflows/*) ;;
                *)
                  echo relevant
                  break
                  ;;
                esac
              done)
              [ -z "$relevant" ] && skip="inert change (docs / CI config only)"
            fi
            [ -z "$skip" ] || {
              hosts="" jobs=""
              echo "gate skipped: $skip -- lint only"
            }
          fi
          picked=$(echo "$all" | jq -c --arg h "$hosts" '[.[] | select(.name | IN($h | splits("[\\s,]+")))]')
          gate='[]'
          case " $jobs " in *" gate "*) gate=$(echo "$picked" | jq -c '[.[] | select(.gate) | .name]') ;; esac
          case " $jobs " in
          *" cross "*) cross=$(echo "$cross" | jq -c --argjson p "$picked" '[.[] | select(.host | IN($p[].name))]') ;;
          *) cross='[]' ;;
          esac
          bindgen='[]' dist='[]'
          case " $jobs " in *" bindgen "*) bindgen=$(echo "$picked" | jq -c '[.[] | select(.name | IN("linux-x64", "windows-x64")) | .name]') ;; esac
          case " $jobs " in *" dist "*) dist=$(echo "$picked" | jq -c '[.[] | select(.name == "windows-x64") | .name]') ;; esac
          prefixes=$(jq -cn --argjson p "$picked" --argjson c "$cross" --argjson b "$bindgen" --argjson d "$dist" \
            '[($p[] | select(.gate) | .name), ($c[].host | sub("windows-arm64"; "windows-x64")), $b[], $d[]] | unique')
          sh_linux=false sh_windows=false
          if [ "$FORK" != true ]; then
            [ "$LINUX_RUNNER" = self-hosted ] && sh_linux=true
            [ "$WINDOWS_RUNNER" = self-hosted ] && sh_windows=true
          fi
          runners=$(echo "$all" | jq -c --argjson l "$sh_linux" --argjson w "$sh_windows" '
            map({key: .name, value: [.os]}) | from_entries
            | if $l then .["linux-x64"] = ["self-hosted", "linux", "x64"] else . end
            | if $w then .["windows-x64"] = ["self-hosted", "windows", "x64"] else . end')
          {
            echo "hosts=$gate"
            echo "prefixes=$prefixes"
            echo "bindgen=$bindgen"
            echo "dist=$dist"
            echo "runners=$runners"
            echo "opts=$opts"
            echo "cross=$cross"
            echo "jobs=$jobs"
            echo "filter=$filter"
          } | tee -a "$GITHUB_OUTPUT"
          echo "tier: $tier"

  # Restore each host's pinned LLVM prefix (llvm-prefix action: S3, with the
  # Actions cache on a hosted runner or ROK_CI_HOME on a self-hosted one).
  llvm-prefix:
    needs: plan
    if: needs.plan.outputs.prefixes != '[]'
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.prefixes) }}
    name: llvm-prefix (${{ matrix.host }})
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.host] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix

  # The local gate (README "Checks") but the corpora, every step even
  # after a failure; then the corpora's test binaries, archived for corpus.
  check:
    needs: [plan, llvm-prefix]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.hosts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
    name: check (${{ matrix.host }})
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.host] }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC -> rok-ci-sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: AWS credentials (sccache writes)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SCCACHE_ROLE }}
          aws-region: us-east-1
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/nextest
      # A Linux build, native too, links the toolchain's C library.
      - name: host C library (Linux)
        if: runner.os == 'Linux'
        run: |
          targets/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      # Every test binary, with rokc, rok and rokls, for the test and
      # corpus jobs, which run it without a build. Its compile-time paths
      # (CARGO_BIN_EXE_*, CARGO_MANIFEST_DIR, rokc_llvm::PLUGIN_DEV) hold
      # because every job checks out at the same path on a GitHub-hosted
      # runner.
      - name: build the tests
        if: ${{ !cancelled() }}
        run: cargo nextest archive --workspace --archive-file "$RUNNER_TEMP/tests.tar.zst"
      # nextest does not run doctests.
      - name: doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc
      - name: fmt library
        if: ${{ !cancelled() }}
        run: '"${CARGO_TARGET_DIR:-target}/debug/rokc" fmt --check library'
      - name: compiler / runtime isolation
        if: ${{ !cancelled() }}
        run: |
          if cargo tree -p rokc -e normal | grep -E '\brokr(_[a-z]+)?\b'; then
            echo "rokc depends on runtime crates"; exit 1
          fi
          if cargo tree -p rokr -e normal | grep -E '\brokc(_[a-z]+)?\b'; then
            echo "rokr depends on compiler crates"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.host }}
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1
          compression-level: 0
      - name: sccache stats
        if: ${{ !cancelled() }}
        run: '"$SCCACHE" --show-stats'

  # The integration and differential corpora from check's archive, a job
  # per host, level and shard (ROK_TEST_SHARD).
  corpus:
    needs: [plan, llvm-prefix, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result == 'success' && needs.plan.outputs.hosts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
        opt: ${{ fromJSON(needs.plan.outputs.opts) }}
        shard: [1, 2, 3, 4]
    name: corpus (${{ matrix.host }} ${{ matrix.opt }} ${{ matrix.shard }}/4)
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.host] }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # OIDC -> rok-ci-sccache
    env:
      ROK_REQUIRE_LLVM: "1"
      ROK_TEST_OPT: ${{ matrix.opt != '-O0' && matrix.opt || '' }}
      ROK_TEST_SHARD: ${{ matrix.shard }}/4
      ROK_TEST_FILTER: ${{ needs.plan.outputs.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: host C library (Linux)
        if: runner.os == 'Linux'
        run: |
          targets/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: AWS credentials (sccache writes)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SCCACHE_ROLE }}
          aws-region: us-east-1
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-${{ matrix.host }}
          path: ${{ runner.temp }}
      # Into the workspace, where check built it (the baked paths); only
      # librokr.a is built here.
      - name: corpora
        run: |
          cargo build -p rokr
          ROK_TEST_PREBUILT=1 cargo nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst" \
            --workspace-remap . --extract-to . --extract-overwrite --no-fail-fast \
            -E 'binary(integration) | binary(differential)'

  # Every other test from check's archive, split over three jobs per host
  # (nextest --partition).
  test:
    needs: [plan, llvm-prefix, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result == 'success' && needs.plan.outputs.hosts != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
        part: [1, 2, 3]
    name: test (${{ matrix.host }} ${{ matrix.part }}/3)
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.host] }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC -> rok-ci-sccache
    env:
      ROK_REQUIRE_LLVM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: host C library (Linux)
        if: runner.os == 'Linux'
        run: |
          targets/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - name: AWS credentials (sccache writes)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SCCACHE_ROLE }}
          aws-region: us-east-1
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-${{ matrix.host }}
          path: ${{ runner.temp }}
      # librokr.a built once before the tests: a test process running its
      # own `cargo build` relinks it under the others (ROK_TEST_PREBUILT,
      # compiler/rokc/tests/common/mod.rs).
      - name: tests
        run: |
          cargo build -p rokr
          ROK_TEST_PREBUILT=1 cargo nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst" \
            --workspace-remap . --extract-to . --extract-overwrite --no-fail-fast \
            --partition hash:${{ matrix.part }}/3 -E 'not (binary(integration) | binary(differential))'

  # The sysroot link check of the non-wasm cross targets, from Linux
  # x86_64.
  cross-link:
    needs: [plan, llvm-prefix, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result != 'failure' && contains(needs.plan.outputs.cross, '"linux-x64"') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)['linux-x64'] }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC -> rok-ci-sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: AWS credentials (sccache writes)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SCCACHE_ROLE }}
          aws-region: us-east-1
      - uses: ./.github/actions/sccache
      - name: targets/build.sh
        run: |
          targets/build.sh x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl i686-unknown-linux-gnu armv7-unknown-linux-gnueabihf i686-pc-windows-msvc
      - run: ROK_REQUIRE_LLVM=1 cargo test --test cli -- cross_targets_link_from_the_sysroot

  # The corpora of a cross target on a host that runs it: i686 Linux
  # natively (the i386 loader and libc), armv7 under qemu-user, musl
  # static, i686 Windows under WOW64, arm64 Windows natively.
  cross:
    needs: [plan, llvm-prefix, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result != 'failure' && needs.plan.outputs.cross != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.cross) }}
        opt: ${{ fromJSON(needs.plan.outputs.opts) }}
    name: cross (${{ matrix.entry.target }} ${{ matrix.opt }})
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.entry.host] }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # OIDC -> rok-ci-sccache
    env:
      QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf
      ROK_REQUIRE_LLVM: "1"
      ROK_TEST_TARGET: ${{ matrix.entry.target }}
      ROK_TEST_OPT: ${{ matrix.opt != '-O0' && matrix.opt || '' }}
      ROK_TEST_FILTER: ${{ needs.plan.outputs.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
        with:
          arch: ${{ matrix.entry.host == 'windows-arm64' && 'X64' || '' }}
      - name: i386 and armhf runtimes, qemu-user
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && !contains(matrix.entry.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libc6-i386 libc6-armhf-cross qemu-user-binfmt
      - name: toolchain (rust-toolchain.toml)
        if: matrix.entry.host != 'windows-arm64'
        run: rustup toolchain install && rustc -vV
      - name: toolchain (rust-toolchain.toml, x64 under emulation)
        if: matrix.entry.host == 'windows-arm64'
        run: |
          t=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)-x86_64-pc-windows-msvc
          rustup toolchain install "$t" --profile minimal --force-non-host
          echo "RUSTUP_TOOLCHAIN=$t" >>"$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=$t rustc -vV
      - name: AWS credentials (sccache writes)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SCCACHE_ROLE }}
          aws-region: us-east-1
      - uses: ./.github/actions/sccache
      - name: targets/build.sh
        run: targets/build.sh "$ROK_TEST_TARGET"
      - run: cargo test --test integration --test differential

  # The wasm32 corpora (targets/test-wasm.sh), a job per target:
  # wasmtime and node (the image's, 18+); the image's clang has the
  # WebAssembly target, so wasm32-wasi's profile runtime and PGO test are
  # built too.
  wasm:
    needs: [plan, llvm-prefix, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result != 'failure' && contains(needs.plan.outputs.jobs, 'wasm') }}
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasi, wasm32-wasi-threads, wasm32-unknown-unknown]
    name: wasm (${{ matrix.target }})
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)['linux-x64'] }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV && node --version && clang --print-targets | grep wasm32
      - run: targets/test-wasm.sh ${{ matrix.target }}

  # rokc bindgen against the pinned libclang (.github/actions/libclang-prefix),
  # nightly on linux-x64 and windows-x64.
  bindgen:
    needs: [plan, llvm-prefix, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result != 'failure' && needs.plan.outputs.bindgen != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.bindgen) }}
    name: bindgen (${{ matrix.host }})
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.host] }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # OIDC -> rok-ci-sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - uses: ./.github/actions/libclang-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: AWS credentials (sccache writes)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.SCCACHE_ROLE }}
          aws-region: us-east-1
      - uses: ./.github/actions/sccache
      - name: host C library (Linux)
        if: runner.os == 'Linux'
        run: |
          targets/build.sh "$(rustc -vV | sed -n 's/^host: //p')"
      - run: ROK_REQUIRE_LLVM=1 ROK_REQUIRE_LIBCLANG=1 cargo test --test cli -- bindgen

  # The release archive (dist-native.sh) and its install (install.ps1
  # -NoModifyPath into a scratch ROK_HOME), nightly on windows-x64: a
  # program, and a package's build / run / test, with nothing but the
  # installed toolchain on PATH.
  dist:
    needs: [plan, llvm-prefix, check, corpus, cross]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result != 'failure' && needs.corpus.result != 'failure' && needs.cross.result != 'failure' && needs.plan.outputs.dist != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.dist) }}
    name: dist (${{ matrix.host }})
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.host] }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/llvm-prefix
      - uses: ./.github/actions/libclang-prefix
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -vV
      - name: dist-native.sh
        run: scripts/dist-native.sh --out "$RUNNER_TEMP/dist"
      - name: install.ps1, then rok alone
        shell: pwsh
        run: |
          $env:ROK_HOME = "$env:RUNNER_TEMP\rok-home"
          $zip = Get-ChildItem "$env:RUNNER_TEMP\dist" -Filter 'rok-*-x86_64-pc-windows-msvc.zip' | Select-Object -First 1
          & ./install.ps1 -Archive $zip.FullName -NoModifyPath
          if ($LASTEXITCODE) { throw 'install.ps1 failed' }
          $env:PATH = "$env:ROK_HOME\bin;$env:SystemRoot\System32"
          function Must { rok.exe @args; if ($LASTEXITCODE) { throw "rok $args failed" } }
          Set-Location $env:RUNNER_TEMP
          Set-Content hello.rok 'fn main() { println("hello"); }'
          $out = rok.exe run hello.rok
          if ($LASTEXITCODE -or $out -ne 'hello') { throw "rok run hello.rok: $out" }
          Must new --lib --bin demo
          Set-Location demo
          Must build
          Must run
          Must build --release
          Must test

  # The one required status check. Passes when lint/plan/llvm-prefix/check/test/corpus passed or
  # were skipped, fails if any failed or was cancelled. Requiring this instead
  # of each matrix job keeps a skipped job from blocking the merge; including
  # lint keeps a lint failure (which skips the rest) from passing the gate.
  ci-gate:
    needs: [lint, plan, llvm-prefix, check, test, corpus]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: gate result
        run: |
          echo "lint=${{ needs.lint.result }} plan=${{ needs.plan.result }} llvm-prefix=${{ needs['llvm-prefix'].result }} check=${{ needs.check.result }} test=${{ needs.test.result }} corpus=${{ needs.corpus.result }}"
          for r in "${{ needs.lint.result }}" "${{ needs.plan.result }}" "${{ needs['llvm-prefix'].result }}" "${{ needs.check.result }}" "${{ needs.test.result }}" "${{ needs.corpus.result }}"; do
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::a gate job did not pass: $r"
                exit 1
                ;;
            esac
          done
          echo "gate passed"

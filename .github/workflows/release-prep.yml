name: release-prep

# Make or refresh branch release/<version>: one `release: <version>` commit
# on main with the version bump and a CHANGELOG section built from the
# changelog: blocks of the PRs merged since the last tag
# (scripts/release-prep.sh), pushed by the rok-lang-release App. Then fill
# its Summary and Highlights on the branch; changelog-lint.yml checks every
# push there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to prepare, X.Y.Z"
        required: true

permissions:
  contents: read

# Shared with release.yml: nothing is prepared while a release runs.
concurrency:
  group: rok-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only the App creates release/* branches (ruleset); its key is here.
    environment: release-prep
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run release-prep from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: token
        uses: rok-lang/.github/actions/app-token@v1.0.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          repositories: rok
          permissions: contents:write
      # cargo update --offline needs the locked crates.
      - name: toolchain (rust-toolchain.toml) and crates
        run: rustup toolchain install && cargo fetch --locked
      - name: release-prep.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "rok-lang-release[bot]"
          git config user.email "352646604+rok-lang-release[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$APP_TOKEN@github.com/$GH_REPO"
          scripts/release-prep.sh --push "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

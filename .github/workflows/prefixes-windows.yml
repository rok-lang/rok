name: prefixes (windows)

# Build the pinned Windows LLVM prefix in CI and publish it to S3 at
# llvm/<version>/x86_64-pc-windows-msvc/llvm.tar.gz (for llvm-prefix). A cold
# build is ~6 h on a 2-core runner (the job limit); a larger runner finishes
# well under it, so no box or pre-staged llvm-src.tar.gz. Run once per version,
# or when a build script or the PGO profile changes. Keyless OIDC
# (rok-ci-artifacts).
#
# Needs a larger Windows runner, labelled by vars.ROK_WINDOWS_X64_XL_RUNNER
# (e.g. rok-windows-x64-16core); a future arm64 build would use
# ROK_WINDOWS_ARM64_XL_RUNNER. Without one the job times out at 6 h.
on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC -> assume rok-ci-artifacts for the S3 upload
  contents: read

env:
  AWS_ROLE: arn:aws:iam::893677554379:role/rok-ci-artifacts
  AWS_REGION: us-east-1
  BUCKET: rok-lang-artifacts
  TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: ${{ vars.ROK_WINDOWS_X64_XL_RUNNER || 'windows-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # The MSVC x64 developer environment for build.ps1 (same approach as
      # .github/actions/llvm-prefix). VCINSTALLDIR / VSINSTALLDIR stay unset.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the MSVC x64 tools' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notin 'VCINSTALLDIR', 'VSINSTALLDIR' -and
                [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])"
            }
          } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # build.ps1 needs cmake, ninja, Python 3 and clang-cl on PATH. The image
      # has cmake and Python; add ninja. Its bundled clang-cl is older than the
      # PGO profile's format, so fetch the pinned LLVM's own clang-cl and put it
      # first on PATH.
      - name: build tools
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $v = ((Select-String -Path llvm/build.sh -Pattern '^VERSION=').Line -replace '^VERSION=', '').Trim()
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/clang+llvm-$v-x86_64-pc-windows-msvc.tar.xz"
          $tb = Join-Path $env:RUNNER_TEMP 'clang+llvm.tar.xz'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tb
          $dst = Join-Path $env:RUNNER_TEMP 'clang+llvm'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Push-Location $dst
          try { cmake -E tar xf $tb } finally { Pop-Location }
          $bin = Join-Path $dst "clang+llvm-$v-x86_64-pc-windows-msvc\bin"
          if (-not (Test-Path "$bin\clang-cl.exe")) { throw "clang-cl missing in $bin" }
          Add-Content $env:GITHUB_PATH $bin

      # clang-cl (not cl) for both C and CXX: it reads rok-msvc.profdata.tar.xz,
      # and CMake rejects mixing a GNU-like C compiler with an MSVC-like C++ one.
      - name: Build, strip and publish LLVM
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          $v = ((Select-String -Path llvm/build.sh -Pattern '^VERSION=').Line -replace '^VERSION=', '').Trim()
          $pfx = Join-Path $env:RUNNER_TEMP "llvm-$v"
          $log = Join-Path $env:RUNNER_TEMP 'llvm-build.log'
          & powershell -NoProfile -ExecutionPolicy Bypass -File llvm/build.ps1 $pfx 2>&1 | Tee-Object $log
          if ($LASTEXITCODE) { throw "build.ps1 failed ($LASTEXITCODE)" }
          if (Select-String -Quiet -Path $log -Pattern 'without PGO') {
            throw 'the LLVM prefix was built without rok-msvc.profdata.tar.xz (clang-cl missing?)'
          }
          # Drop build intermediates rokc_llvm never links; mark it complete.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$pfx\lib\objects-Release", "$pfx\share\opt-viewer"
          New-Item -ItemType File -Force "$pfx\.complete" | Out-Null
          $a = "rok-llvm-$v-windows-x64.tar.gz"
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          tar -C $env:RUNNER_TEMP -czf "$out\$a" "llvm-$v"
          if ($LASTEXITCODE) { throw 'tar failed' }
          $h = (Get-FileHash -Algorithm SHA256 "$out\$a").Hash.ToLower()
          Set-Content -NoNewline -Path "$out\$a.sha256" -Value "$h  $a"
          aws s3 cp "$out\$a"        "s3://$env:BUCKET/llvm/$v/$env:TRIPLE/llvm.tar.gz"
          aws s3 cp "$out\$a.sha256" "s3://$env:BUCKET/llvm/$v/$env:TRIPLE/llvm.tar.gz.sha256"

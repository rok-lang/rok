name: release

# Build all six host archives on GitHub-hosted runners and cut the GitHub
# release. macOS/Windows use dist-native.sh with the pinned LLVM/libclang prefixes,
# which the prefix actions download from the rok-lang-artifacts S3 bucket
# (built by prefixes.yml; Windows published by prefixes-windows.yml).
# Linux gnu/musl use the container scripts, whose LLVM is downloaded from the
# same bucket (dist-llvm/, published by prefixes.yml). A tag push publishes;
# a manual run only verifies.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The six host archives come from release-targets.json, the single source
  # of truth (release.sh and scripts/check-targets.sh read it too).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: echo "targets=$(jq -c '.targets' release-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- native hosts: macOS + Windows (dist-native.sh, host LLVM/libclang) ---
      # The prefixes are downloaded from the rok-lang-artifacts S3 bucket
      # (published by prefixes.yml; Windows by prefixes-windows.yml).
      - uses: ./.github/actions/llvm-prefix
        if: matrix.kind == 'native'
      - uses: ./.github/actions/libclang-prefix
        if: matrix.kind == 'native'
      - name: rust toolchain
        if: matrix.kind == 'native'
        run: rustup toolchain install && rustc -vV
      - name: dist-native.sh
        if: matrix.kind == 'native'
        shell: bash
        run: scripts/dist-native.sh --out "$PWD/dist"

      # --- linux gnu/musl (dist-linux-{gnu,musl}.sh in a container) ---
      # The container LLVM/libclang is downloaded from S3 (dist-llvm/,
      # published by prefixes.yml); the scripts fall back to building it.
      - name: dist-linux-gnu.sh
        if: matrix.kind == 'gnu'
        run: scripts/dist-linux-gnu.sh --out "$PWD/dist"
      - name: dist-linux-musl.sh
        if: matrix.kind == 'musl'
        run: scripts/dist-linux-musl.sh --out "$PWD/dist"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC for the provenance attestation
      attestations: write  # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: list
        run: ls -la dist
      - name: verify
        run: scripts/release.sh --dir dist
      # Signed SLSA build provenance for the archives (tag releases only).
      - name: attest provenance (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.zip
      - name: publish (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --dir dist --publish

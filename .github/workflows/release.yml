name: release

# Build the six host archives and cut the GitHub release. macOS/Windows run
# dist-native.sh; Linux gnu/musl run the container scripts. LLVM/libclang
# prefixes come from S3 (published by prefixes.yml, Windows by
# prefixes-windows.yml). A tag push publishes; a manual run only verifies.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time, whatever the tag or ref.
concurrency:
  group: rok-release
  cancel-in-progress: false

jobs:
  # A release-ready run passed on this exact commit (full ci, a release.yml
  # dry run, version and notes); this re-checks the cheap parts on the tag.
  ready:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-ready.yml
    with:
      ref: ${{ github.sha }}
      verify_only: true
    # What release-ready's jobs ask for; in verify-only mode only reads run.
    permissions:
      actions: write
      contents: read
      statuses: write

  # A tag publishes only a ready commit whose main `ci` run passed
  # `ci-gate`; a run still in progress is waited for.
  ci-green:
    needs: ready
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: main ci-gate on this commit
        run: |
          # The newest main push run that was not cancelled.
          runs="repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push"
          while :; do
            read -r id status < <(gh api "$runs" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0] | "\(.id // "") \(.status // "")"')
            if [ -z "$id" ]; then
              echo "::error::no main ci run for $GITHUB_SHA; push the commit to main first"
              exit 1
            fi
            [ "$status" = completed ] && break
            echo "ci run $id: $status"
            sleep 60
          done
          gate=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | select(.name == "ci-gate") | .conclusion')
          if [ "$gate" != success ]; then
            echo "::error::ci-gate of run $id is '${gate:-missing}'; fix main (or rerun it) before tagging"
            exit 1
          fi
          echo "ci-gate passed in run $id"

  # The six host archives come from release-targets.json, the single source
  # of truth (release.sh and scripts/check-targets.sh read it too).
  plan:
    needs: ci-green
    # A manual run skips ci-green and only verifies. A tag needs it green:
    # after a failed ready it is skipped, not failed.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.ci-green.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: echo "targets=$(jq -c '.targets' release-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # plan ran even though ci-green was skipped; without this the skip
    # carries over and a manual run builds nothing.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native hosts (macOS, Windows): dist-native.sh with the host prefixes.
      - uses: ./.github/actions/llvm-prefix
        if: matrix.kind == 'native'
      - uses: ./.github/actions/libclang-prefix
        if: matrix.kind == 'native'
      - name: rust toolchain
        if: matrix.kind == 'native'
        run: rustup toolchain install && rustc -vV
      - name: dist-native.sh
        if: matrix.kind == 'native'
        shell: bash
        run: scripts/dist-native.sh --out "$PWD/dist"

      # Linux gnu/musl: the container scripts, LLVM from dist-llvm/ on S3
      # (they fall back to building it).
      - name: dist-linux-gnu.sh
        if: matrix.kind == 'gnu'
        run: scripts/dist-linux-gnu.sh --out "$PWD/dist"
      - name: dist-linux-musl.sh
        if: matrix.kind == 'musl'
        run: scripts/dist-linux-musl.sh --out "$PWD/dist"

      # The commit this build checked out; publish holds the tag to it.
      - name: built commit
        shell: bash
        run: git rev-parse HEAD > "dist/commit-${{ matrix.name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC for the provenance attestation
      attestations: write  # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: list
        run: ls -la dist
      # Every build ran on the commit this run started for.
      - name: built commit
        id: built
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          want=$(echo "$TARGETS" | jq length)
          n=$(find dist -maxdepth 1 -name 'commit-*' | wc -l)
          got=$(cat dist/commit-* | sort -u)
          if [ "$n" -ne "$want" ] || [ "$got" != "$GITHUB_SHA" ]; then
            echo "::error::$n of $want builds report a commit ($(echo "$got" | tr '\n' ' ')); this run is for $GITHUB_SHA"
            exit 1
          fi
          rm dist/commit-*
          echo "sha=$got" >> "$GITHUB_OUTPUT"
      - name: verify
        run: scripts/release.sh --dir dist
      # Signed SLSA build provenance for the archives (tag releases only).
      - name: attest provenance (tag only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.zip
      # A manual run on a tag ref only verifies. release.sh holds the tag to
      # the built commit, uploads to a draft and checks it before going public.
      - name: publish (tag only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          scripts/release-notes.sh "$(cat dist/rok-version)" > dist/notes.md
          scripts/release.sh --dir dist --publish --commit "$SHA"

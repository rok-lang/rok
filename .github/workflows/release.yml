name: release

# Build the six host archives and cut the GitHub release. macOS/Windows run
# dist-native.sh; Linux gnu/musl run the container scripts. LLVM/libclang
# prefixes come from S3 (published by prefixes.yml, Windows by
# prefixes-windows.yml). A tag push publishes; a manual run only verifies.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag publishes only a commit whose main `ci` run passed `ci-gate`;
  # a run still in progress is waited for.
  ci-green:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: main ci-gate on this commit
        run: |
          runs="repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push"
          while :; do
            read -r id status < <(gh api "$runs" --jq '.workflow_runs[0] | "\(.id // "") \(.status // "")"')
            if [ -z "$id" ]; then
              echo "::error::no main ci run for $GITHUB_SHA; push the commit to main first"
              exit 1
            fi
            [ "$status" = completed ] && break
            echo "ci run $id: $status"
            sleep 60
          done
          gate=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | select(.name == "ci-gate") | .conclusion')
          if [ "$gate" != success ]; then
            echo "::error::ci-gate of run $id is '${gate:-missing}'; fix main (or rerun it) before tagging"
            exit 1
          fi
          echo "ci-gate passed in run $id"

  # The six host archives come from release-targets.json, the single source
  # of truth (release.sh and scripts/check-targets.sh read it too).
  plan:
    needs: ci-green
    # A manual run skips ci-green and only verifies.
    if: ${{ !cancelled() && needs.ci-green.result != 'failure' }}
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: targets
        run: echo "targets=$(jq -c '.targets' release-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native hosts (macOS, Windows): dist-native.sh with the host prefixes.
      - uses: ./.github/actions/llvm-prefix
        if: matrix.kind == 'native'
      - uses: ./.github/actions/libclang-prefix
        if: matrix.kind == 'native'
      - name: rust toolchain
        if: matrix.kind == 'native'
        run: rustup toolchain install && rustc -vV
      - name: dist-native.sh
        if: matrix.kind == 'native'
        shell: bash
        run: scripts/dist-native.sh --out "$PWD/dist"

      # Linux gnu/musl: the container scripts, LLVM from dist-llvm/ on S3
      # (they fall back to building it).
      - name: dist-linux-gnu.sh
        if: matrix.kind == 'gnu'
        run: scripts/dist-linux-gnu.sh --out "$PWD/dist"
      - name: dist-linux-musl.sh
        if: matrix.kind == 'musl'
        run: scripts/dist-linux-musl.sh --out "$PWD/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC for the provenance attestation
      attestations: write  # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: list
        run: ls -la dist
      - name: verify
        run: scripts/release.sh --dir dist
      # Signed SLSA build provenance for the archives (tag releases only).
      - name: attest provenance (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.zip
      - name: publish (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --dir dist --publish

  # Point the Nix flake at the new release. The sha256s exist only once the
  # archives are out, so this runs after publish: regenerate nix/sources.json,
  # build and run it on each Nix system (nix.yml), then push it to main.
  nix-sources:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/nix-sources.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-sources
          path: nix/sources.json
          if-no-files-found: error

  nix-verify:
    needs: nix-sources
    uses: ./.github/workflows/nix.yml
    with:
      sources: nix-sources

  nix-push:
    needs: nix-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nix-sources
          path: nix
      # Straight to main like the release commit; retry if main moved.
      - name: commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet && { echo "nix/sources.json already at ${GITHUB_REF_NAME#v}"; exit 0; }
          git commit -qam "chore(nix): install ${GITHUB_REF_NAME#v}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
